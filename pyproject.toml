[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecproc"
version = "0.1.0"
description = "Domain-specific language and toolchain for electrochemical procedures"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "ElectrocatalystAI" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "typer>=0.9",
    "jsonschema>=4.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "pre-commit>=3.0",
]
pdf = [
    "reportlab>=4.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
ecproc = "ecproc.cli.main:app"

[project.entry-points."ecproc.targets"]
python = "ecproc.targets.python:PythonTarget"
manual = "ecproc.targets.manual:ManualTarget"

[tool.hatch.build.targets.wheel]
packages = ["src/ecproc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ecproc"]

[tool.coverage.report]
fail_under = 90
show_missing = true
